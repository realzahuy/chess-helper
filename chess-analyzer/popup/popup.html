<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Analyzer</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><span class="eyebrow">LOCAL STOCKFISH</span><h1>Chess Analyzer</h1></header>
  <div class="setting-row">
    <label for="enabled"><span data-i18n="status">Trạng thái</span> <strong id="state-label">OFF</strong></label>
    <input id="enabled" type="checkbox" role="switch" aria-label="Bật hoặc tắt Chess Analyzer" disabled>
  </div>
  <label class="mode-label" for="analysis-mode" data-i18n="analysis">Phân tích</label>
  <select id="analysis-mode" disabled>
    <option value="fast">Fast · 500 ms</option>
    <option value="strong" selected>Strong · 2000 ms</option>
    <option value="deep">Deep · 5000 ms</option>
  </select>
  <label class="mode-label language-label" for="language" data-i18n="language">Ngôn ngữ</label>
  <select id="language" aria-label="Ngôn ngữ" disabled>
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
  </select>
  <p class="note" data-i18n="popupNote">ON tự phân tích trên Analysis Board, computer/bot và ván với người thật, kể cả khi đang chơi. Thiếu FEN đầy đủ thì extension sẽ chờ.</p>
  <p id="status" role="status" aria-live="polite">Đang kiểm tra kết nối với tab…</p>
  <p id="connection-details" class="note"></p>
</body>
</html>
