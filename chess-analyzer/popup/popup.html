<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Analyzer</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><span class="eyebrow">LOCAL STOCKFISH</span><h1>Chess Analyzer</h1></header>
  <div class="setting-row">
    <label for="enabled"><span data-i18n="status">Trạng thái</span> <strong id="state-label">OFF</strong></label>
    <input id="enabled" type="checkbox" role="switch" aria-label="Bật hoặc tắt Chess Analyzer" disabled>
  </div>
  <label class="mode-label language-label" id="language-label" for="language" data-i18n="language">Ngôn ngữ</label>
  <div class="dropdown" data-setting="language">
    <button id="language" class="dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-options" aria-labelledby="language-label language" disabled>
      <span class="dropdown-value">Tiếng Việt</span><span class="dropdown-chevron" aria-hidden="true"></span>
    </button>
    <div id="language-options" class="dropdown-menu" role="listbox" aria-labelledby="language-label" hidden>
      <button class="dropdown-option" type="button" role="option" data-value="vi" aria-selected="true">Tiếng Việt</button>
      <button class="dropdown-option" type="button" role="option" data-value="en" aria-selected="false">English</button>
    </div>
  </div>
  <label class="mode-label" id="analysis-label" for="analysis-mode" data-i18n="analysis">Phân tích</label>
  <div class="dropdown" data-setting="analysisMode">
    <button id="analysis-mode" class="dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="analysis-mode-options" aria-labelledby="analysis-label analysis-mode" disabled>
      <span class="dropdown-value">Strong · 2000 ms</span><span class="dropdown-chevron" aria-hidden="true"></span>
    </button>
    <div id="analysis-mode-options" class="dropdown-menu" role="listbox" aria-labelledby="analysis-label" hidden>
      <button class="dropdown-option" type="button" role="option" data-value="fast" aria-selected="false">Fast · 500 ms</button>
      <button class="dropdown-option" type="button" role="option" data-value="strong" aria-selected="true">Strong · 2000 ms</button>
      <button class="dropdown-option" type="button" role="option" data-value="deep" aria-selected="false">Deep · 5000 ms</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite">Đang kiểm tra kết nối với tab…</p>
  <p id="connection-details" class="note"></p>
</body>
</html>
